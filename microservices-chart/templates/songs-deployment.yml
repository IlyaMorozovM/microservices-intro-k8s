apiVersion: apps/v1
kind: Deployment
metadata:
  name: songs-deployment
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.songs.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: songs-ms
  template:
    metadata:
      labels:
        app: songs-ms
    spec:
      enableServiceLinks: false
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z songs-db 5432; do echo waiting for db; sleep 2; done']
      containers:
        - name: songs-container
          image: imarozau12/songs-service:2.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: songs-ms-config
          volumeMounts:
            - name: songs-storage
              mountPath: /app/data
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
      volumes:
        - name: songs-storage
          persistentVolumeClaim:
            claimName: songs-pvc
