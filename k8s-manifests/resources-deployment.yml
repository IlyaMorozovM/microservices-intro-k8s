apiVersion: apps/v1
kind: Deployment
metadata:
  name: resources-deployment
  namespace: k8s-program
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resources-ms
  template:
    metadata:
      labels:
        app: resources-ms
    spec:
      enableServiceLinks: false
      containers:
        - name: resources-container
          image: resources-service:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: RESOURCES_DB_URL
              value: "resources-db"
            - name: RESOURCES_DB_PORT
              value: "5432"
            - name: SONGS_MS_URL
              value: "songs-ms"
            - name: SONGS_MS_PORT
              value: "8081"
            - name: ENABLE_EUREKA_CLIENT
              value: "false"