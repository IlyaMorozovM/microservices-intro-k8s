apiVersion: apps/v1
kind: Deployment
metadata:
  name: songs-deployment
  namespace: k8s-program
spec:
  replicas: 2
  selector:
    matchLabels:
      app: songs-ms
  template:
    metadata:
      labels:
        app: songs-ms
    spec:
      enableServiceLinks: false
      containers:
        - name: songs-container
          image: songs-service:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: SONGS_DB_URL
              value: "songs-db"
            - name: SONGS_DB_PORT
              value: "5432"
            - name: ENABLE_EUREKA_CLIENT
              value: "false"
          volumeMounts:
            - name: songs-storage
              mountPath: /app/data
      volumes:
        - name: songs-storage
          persistentVolumeClaim:
            claimName: songs-pvc